name: RDP via Tailscale + RustDesk (fast)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet (e.g. you@gmail.com)"
        required: true
      ts_api_key:
        description: "Tailscale API key (device admin, no 'Bearer')"
        required: true
      ts_authkey:
        description: "Tailscale Auth key (reusable or ephemeral)"
        required: true
      test_mode:
        description: "Run 5-minute test (unchecked = ~6h)"
        type: boolean
        default: false
      purge_bullet:
        description: "Purge bullet* devices at start & end"
        type: boolean
        default: true
      install_rustdesk:
        description: "Install & launch RustDesk"
        type: boolean
        default: true
      crd_code:
        description: "Chrome Remote Desktop CODE (optional; paste only CODE)"
        required: false
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: tailscale-rdp-singleton
  cancel-in-progress: false

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 370
    env:
      RDP_USER:    Bullettemporary
      RDP_PASS:    Bullet@12345
      TS_HOSTNAME: bullet
    steps:
      - name: Set up job
        run: |
          Write-Host "Runner: $env:RUNNER_OS $env:ImageOS"

      - name: Compute runtime & helpers
        id: cfg
        shell: pwsh
        run: |
          function Yes($v){ "$v" -match '^(?i:true|1|yes|on)$' }

          $test     = Yes("${{ inputs.test_mode }}")
          $runtime  = if($test){ 5 } else { 355 }
          $purge    = Yes("${{ inputs.purge_bullet }}")
          $doRD     = Yes("${{ inputs.install_rustdesk }}")

          echo "test=$test"
          echo "runtime=$runtime"
          echo "purge=$purge"
          echo "rustdesk=$doRD"

          "test=$test"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "runtime=$runtime" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "purge=$purge"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "rustdesk=$doRD"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Purge bullet* devices (start)
        if: ${{ steps.cfg.outputs.purge == 'True' }}
        shell: pwsh
        env:
          TAILNET:  ${{ inputs.ts_tailnet }}
          APIKEY:   ${{ inputs.ts_api_key }}
        run: |
          $ErrorActionPreference = "Continue"
          $pair = "$env:TAILNET:$env:APIKEY"
          $b64  = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair))
          $hdrs = @{ Authorization = "Basic $b64"; Accept = "application/json" }

          try {
            $list = Invoke-RestMethod -Uri "https://api.tailscale.com/api/v2/tailnet/$($env:TAILNET)/devices" -Headers $hdrs -Method GET
            $targets = @($list.devices | Where-Object { $_.hostname -match '^bullet(\d+)?$' -or $_.hostname -like 'bullet*' })
            if($targets.Count -gt 0){
              foreach($d in $targets){
                Write-Host "Deleting device $($d.hostname) / $($d.id)"
                Invoke-RestMethod -Uri "https://api.tailscale.com/api/v2/device/$($d.id)" -Headers $hdrs -Method DELETE | Out-Null
                Start-Sleep -Milliseconds 300
              }
            } else {
              Write-Host "No bullet* devices to delete."
            }
          } catch {
            Write-Host "Purge warning: $($_.Exception.Message)"
          }

      - name: Setup Tailscale + RDP
        shell: pwsh
        env:
          AUTHKEY: ${{ inputs.ts_authkey }}
        run: |
          $ErrorActionPreference = "Stop"

          # Enable RDP user
          $u=$env:RDP_USER; $p=$env:RDP_PASS
          $sec = ConvertTo-SecureString $p -AsPlainText -Force
          if (-not (Get-LocalUser -Name $u -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Add-LocalGroupMember -Group Administrators -Member $u
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u
          } else {
            Set-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Enable-LocalUser -Name $u
          }
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null

          # Install Tailscale quickly if missing
          $exe="C:\Program Files\Tailscale\tailscale.exe"
          if(-not (Test-Path $exe)){
            $url='https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe'
            $dst="$env:TEMP\tailscale-setup.exe"
            Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
            Start-Process $dst -ArgumentList "/quiet" -Wait
          }
          Start-Service Tailscale -ErrorAction SilentlyContinue

          # Bring up with fixed hostname "bullet"
          & $exe logout | Out-Null
          & $exe up --authkey "$env:AUTHKEY" --hostname "$env:TS_HOSTNAME" --accept-routes --accept-dns=false
          Start-Sleep -Seconds 2

          $ip4 = (& $exe ip -4 | Select-Object -First 1)
          $dns = (& $exe status --json | ConvertFrom-Json).Self.DNSName
          Write-Host "RDP login → user=$env:RDP_USER pass=$env:RDP_PASS ip=$ip4 dns=$dns"

      - name: Install & Launch RustDesk (fast)
        if: ${{ steps.cfg.outputs.rustdesk == 'True' }}
        shell: pwsh
        run: |
          $ErrorActionPreference="Continue"
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.exe"
          $dst = "$env:TEMP\rustdesk.exe"
          if (-not (Test-Path $dst)) {
            Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
          }
          Start-Process $dst -ArgumentList "/VERYSILENT","/NORESTART" -Wait

          # Find and launch quickly
          $rd = Get-ChildItem "C:\Program Files*" -Recurse -Filter "rustdesk.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if($rd){
            Write-Host "Launching RustDesk: $($rd.FullName)"
            Start-Process $rd.FullName
            Start-Sleep -Seconds 3
          } else {
            Write-Host "RustDesk not found after install."
          }

      - name: Chrome Remote Desktop (optional) — accept CODE only
        if: ${{ inputs.crd_code != '' }}
        shell: pwsh
        env:
          CODE: ${{ inputs.crd_code }}
        run: |
          $ErrorActionPreference="Continue"
          $crdExe = Join-Path ${env:PROGRAMFILES(X86)} "Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          if(-not (Test-Path $crdExe)){
            Write-Host "CRD not installed on this image; skipping."
            exit 0
          }
          $code  = $env:CODE.Trim()
          if([string]::IsNullOrWhiteSpace($code)){ Write-Host "Empty CODE; skipping."; exit 0 }
          $redir = "https://remotedesktop.google.com/_/oauthredirect"
          $args  = @("--code=$code","--redirect-url=$redir","--name=$env:COMPUTERNAME")
          Start-Process $crdExe -ArgumentList $args -WindowStyle Hidden
          Write-Host "Started Chrome Remote Desktop host with provided CODE."

      - name: Keep alive (~${{ steps.cfg.outputs.runtime }} min)
        shell: pwsh
        run: |
          $ErrorActionPreference="SilentlyContinue"
          $mins = [int]"${{ steps.cfg.outputs.runtime }}"
          $end=(Get-Date).AddMinutes($mins); $tick=0
          while((Get-Date) -lt $end){
            $left=[int]([math]::Ceiling(($end-(Get-Date)).TotalMinutes))
            if(($tick % 30) -eq 0){ Write-Host "Alive… $left min left"; }
            Start-Sleep -Seconds 60
            $tick++
          }
          Write-Host "Keep-alive finished."

      - name: Purge bullet* devices (end)
        if: ${{ steps.cfg.outputs.purge == 'True' }}
        shell: pwsh
        env:
          TAILNET:  ${{ inputs.ts_tailnet }}
          APIKEY:   ${{ inputs.ts_api_key }}
        run: |
          $ErrorActionPreference = "Continue"
          $pair = "$env:TAILNET:$env:APIKEY"
          $b64  = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair))
          $hdrs = @{ Authorization = "Basic $b64"; Accept = "application/json" }

          try {
            $list = Invoke-RestMethod -Uri "https://api.tailscale.com/api/v2/tailnet/$($env:TAILNET)/devices" -Headers $hdrs -Method GET
            $targets = @($list.devices | Where-Object { $_.hostname -match '^bullet(\d+)?$' -or $_.hostname -like 'bullet*' })
            foreach($d in $targets){
              Write-Host "Deleting device $($d.hostname) / $($d.id)"
              Invoke-RestMethod -Uri "https://api.tailscale.com/api/v2/device/$($d.id)" -Headers $hdrs -Method DELETE | Out-Null
              Start-Sleep -Milliseconds 300
            }
          } catch {
            Write-Host "Purge warning (end): $($_.Exception.Message)"
          }
