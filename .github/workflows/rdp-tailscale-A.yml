name: RDP via Tailscale + (optional) CRD (Workflow A)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet (e.g. you@gmail.com)"
        required: true
      ts_api_key:
        description: "Tailscale API key (device admin, no 'Bearer')"
        required: true
      ts_authkey:
        description: "Tailscale Auth key (reusable or ephemeral)"
        required: true
      test_mode:
        description: "Run 5-minute test (otherwise ~6 hours)"
        type: boolean
        default: false
      multi_rdp:
        description: "Launch multiple parallel RDP (bullet1..N)"
        type: boolean
        default: false
      rdp_count:
        description: "How many RDP when multi_rdp=true (max 10)"
        required: false
        default: "1"
      purge_bullet:
        description: "Purge bullet* devices at start/end"
        required: false
        default: "true"
      runtime_minutes:
        description: "Manual override (ignored unless >0). Test=5, normal=355"
        required: false
        default: "0"
      install_rustdesk:
        description: "Install + launch RustDesk"
        type: boolean
        default: true
      crd_code:
        description: "Chrome Remote Desktop one-time CODE only (e.g. 4/0AVGzR1...)"
        required: false
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: tailscale-rdp-singleton
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 370
    env:
      RDP_USER:    Bullettemporary
      RDP_PASS:    Bullet@12345
      BASE_HOST:   bullet
      X_DIR:       C:\Users\Public\Transfer

    steps:
      - name: Set up job
        run: |
          Write-Host "Runner: $env:RUNNER_OS $env:ImageOS"

      - name: Compute hostname
        id: host
        run: |
          function IntOr($v,$def){ if("$v" -match '^\d+$'){ [int]$v } else { [int]$def } }
          function Yes($v){ "$v" -match '^(?i:true|1|yes|on)$' }

          $test = Yes("${{ inputs.test_mode }}")
          $multi = Yes("${{ inputs.multi_rdp }}")
          $count = IntOr("${{ inputs.rdp_count }}", 1)
          if($count -lt 1){ $count = 1 }
          if($count -gt 10){ $count = 10 }

          $rtIn = IntOr("${{ inputs.runtime_minutes }}", 0)
          if($test){ $runtime = 5 }
          elseif($rtIn -gt 0){ $runtime = [Math]::Min($rtIn,355) }
          else { $runtime = 355 }

          # choose this instance's hostname (A dispatches B for others if needed)
          $hostname = if($multi){ "$env:BASE_HOST1" } else { "$env:BASE_HOST" }

          echo "multi=$multi"           | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "count=$count"           | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "runtime=$runtime"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "hostname=$hostname"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          Write-Host "Runtime (minutes): $runtime"
          Write-Host "Multi mode: $multi  count: $count"
          Write-Host "Hostname (this job): $hostname"

      - name: Setup hostname env
        run: |
          $hn = "${{ steps.host.outputs.hostname }}"
          echo "TS_HOSTNAME=$hn" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "RUNTIME_MINUTES=${{ steps.host.outputs.runtime }}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Purge bullet* devices (start)
        if: ${{ inputs.purge_bullet == 'true' || inputs.purge_bullet == 'True' }}
        env:
          TAILNET:  ${{ inputs.ts_tailnet }}
          APIKEY:   ${{ inputs.ts_api_key }}
        run: |
          $ErrorActionPreference="Continue"
          function Purge(){
            param($Tailnet,$ApiKey)
            try{
              $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$ApiKey:"))
              $hdr  = @{ Authorization = "Basic $auth"; Accept = "application/json" }
              $url  = "https://api.tailscale.com/api/v2/tailnet/$Tailnet/devices"
              $r    = Invoke-RestMethod -Method GET -Uri $url -Headers $hdr -UseBasicParsing
              $me   = @{}
              foreach($d in $r.devices){
                if($d.hostname -match '^(?i)bullet(\d+)?$'){
                  $me[$d.id]=$true
                }
              }
              foreach($id in $me.Keys){
                try{
                  $delUrl="https://api.tailscale.com/api/v2/device/$id"
                  Invoke-RestMethod -Method DELETE -Uri $delUrl -Headers $hdr -UseBasicParsing | Out-Null
                  Write-Host "Purged device $id"
                }catch{ Write-Host "WARN purge $id: $($_.Exception.Message)" }
              }
            }catch{ Write-Host "WARN purge list: $($_.Exception.Message)" }
          }
          Purge -Tailnet $env:TAILNET -ApiKey $env:APIKEY

      - name: Setup Tailscale + RDP
        env:
          AUTHKEY: ${{ inputs.ts_authkey }}
        run: |
          $ErrorActionPreference = "Stop"

          # Ensure Tailscale
          $exe = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $exe)) {
            $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe'
            $dst = "$env:TEMP\tailscale-setup.exe"
            Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
            Start-Process -FilePath $dst -ArgumentList "/quiet" -Wait
          }
          Start-Service Tailscale -ErrorAction SilentlyContinue

          # Enable RDP account
          $u=$env:RDP_USER; $p=$env:RDP_PASS
          $sec = ConvertTo-SecureString $p -AsPlainText -Force
          if (-not (Get-LocalUser -Name $u -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Add-LocalGroupMember -Group Administrators -Member $u
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u
          } else {
            Set-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Enable-LocalUser -Name $u
          }
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null

          # Tailscale up with the decided hostname
          & $exe logout | Out-Null
          & $exe up --authkey "$env:AUTHKEY" --hostname "$env:TS_HOSTNAME" --accept-routes --accept-dns=false

          $ip4 = (& $exe ip -4 | Select-Object -First 1)
          $st  = & $exe status --json | ConvertFrom-Json
          Write-Host "RDP login => user=$env:RDP_USER pass=$env:RDP_PASS ip=$ip4"
          Write-Host "dns=$($st.Self.DNSName)"

      - name: Install RustDesk + launch (optional)
        if: ${{ inputs.install_rustdesk }}
        run: |
          $ErrorActionPreference="Continue"
          # first try winget
          try {
            winget install --id RustDesk.RustDesk -e --silent --accept-package-agreements --accept-source-agreements
          } catch { Write-Host "winget RustDesk failed: $($_.Exception.Message)" }
          # fallback EXE
          $rd = Get-ChildItem "C:\Program Files" -Recurse -Filter "rustdesk.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $rd){ $rd = Get-ChildItem "C:\Program Files (x86)" -Recurse -Filter "rustdesk.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if(-not $rd){
            try{
              $url="https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.exe"
              $dst="$env:TEMP\rustdesk.exe"
              Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
              Start-Process $dst -ArgumentList "/verysilent /norestart" -Wait
            }catch{ Write-Host "RustDesk EXE fallback failed: $($_.Exception.Message)" }
          }
          $rd = Get-ChildItem "C:\Program Files","C:\Program Files (x86)" -Recurse -Filter "rustdesk.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if($rd){ Start-Process $rd.FullName; Write-Host "RustDesk launched: $($rd.FullName)" } else { Write-Host "WARNING: RustDesk not found." }

      - name: Chrome Remote Desktop (optional) — accept CODE only
        if: ${{ inputs.crd_code != '' }}
        run: |
          $ErrorActionPreference="Continue"
          $exe = "${Env:ProgramFiles(x86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          if(Test-Path $exe){
            $code = "${{ inputs.crd_code }}"
            $cmd = "& `"$exe`" --code=`"$code`" --redirect-url=`"https://remotedesktop.google.com/_/oauthredirect`" --name=$Env:COMPUTERNAME"
            Write-Host "Running CRD host registration..."
            Invoke-Expression $cmd
            Write-Host "CRD command issued."
          } else {
            Write-Host "⚠️ CRD host binary not found, skipping."
          }

      - name: Keep alive
        run: |
          $mins = [int]"$env:RUNTIME_MINUTES"
          $end=(Get-Date).AddMinutes($mins)
          while((Get-Date) -lt $end){
            $left=[int]([math]::Ceiling(($end-(Get-Date)).TotalMinutes))
            Write-Host "RDP alive... ($left min left)"
            Start-Sleep -Seconds 60
          }

      - name: Purge bullet* devices (end)
        if: ${{ inputs.purge_bullet == 'true' || inputs.purge_bullet == 'True' }}
        env:
          TAILNET:  ${{ inputs.ts_tailnet }}
          APIKEY:   ${{ inputs.ts_api_key }}
        run: |
          $ErrorActionPreference="Continue"
          function Purge(){
            param($Tailnet,$ApiKey)
            try{
              $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("$ApiKey:"))
              $hdr  = @{ Authorization = "Basic $auth"; Accept = "application/json" }
              $url  = "https://api.tailscale.com/api/v2/tailnet/$Tailnet/devices"
              $r    = Invoke-RestMethod -Method GET -Uri $url -Headers $hdr -UseBasicParsing
              foreach($d in $r.devices){
                if($d.hostname -match '^(?i)bullet(\d+)?$'){
                  try{
                    Invoke-RestMethod -Method DELETE -Uri ("https://api.tailscale.com/api/v2/device/{0}" -f $d.id) -Headers $hdr -UseBasicParsing | Out-Null
                    Write-Host "Purged device $($d.id)"
                  }catch{ Write-Host "WARN purge $($d.id): $($_.Exception.Message)" }
                }
              }
            }catch{ Write-Host "WARN purge list: $($_.Exception.Message)" }
          }
          Purge -Tailnet $env:TAILNET -ApiKey $env:APIKEY

      - name: Dispatch additional instances (B) if multi_rdp
        if: ${{ steps.host.outputs.multi == 'True' && steps.host.outputs.count != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $count=[int]"${{ steps.host.outputs.count }}"
          if($count -le 1){ return }
          for($i=2;$i -le $count;$i++){
            $payload = @{
              ts_tailnet      = "${{ inputs.ts_tailnet }}"
              ts_api_key      = "${{ inputs.ts_api_key }}"
              ts_authkey      = "${{ inputs.ts_authkey }}"
              test_mode       = "${{ inputs.test_mode }}"
              purge_bullet    = "${{ inputs.purge_bullet }}"
              runtime_minutes = "${{ steps.host.outputs.runtime }}"
              index           = "$i"
              total           = "$count"
              install_rustdesk= "${{ inputs.install_rustdesk }}"
              crd_code        = "${{ inputs.crd_code }}"
            }
            $url  = "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-B.yml/dispatches"
            $hdr  = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
            $body = @{ ref = "${{ github.ref_name }}"; inputs = $payload } | ConvertTo-Json -Depth 8
            Invoke-WebRequest -Method POST -Uri $url -Headers $hdr -Body $body -UseBasicParsing | Out-Null
            Write-Host "Dispatched B($i/$count)"
          }
