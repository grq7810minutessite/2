name: RDP via Tailscale + RustDesk (full)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet (e.g. you@gmail.com)"
        required: true
      ts_api_key:
        description: "Tailscale API key (no 'Bearer')"
        required: true
      ts_authkey:
        description: "Tailscale Auth key"
        required: true
      test_mode:
        description: "Test (5 min). Off = ~6h"
        type: boolean
        default: false
      purge_bullet:
        description: "Purge bullet* at start & end"
        type: boolean
        default: true
      install_rustdesk:
        description: "Install & launch RustDesk"
        type: boolean
        default: true
      crd_code:
        description: "Chrome Remote Desktop CODE (single-RDP only)"
        required: false
        default: ""
      multi_rdp:
        description: "Spawn multiple RDP instances"
        type: boolean
        default: false
      rdp_count:
        description: "Number of instances (1-10)"
        required: false
        default: "1"
      spawned:
        description: "INTERNAL: child run flag"
        required: false
        default: "false"

permissions:
  contents: read
  actions: write

concurrency:
  group: tailscale-rdp-singleton
  cancel-in-progress: false

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 370
    env:
      RDP_USER:    Bullettemporary
      RDP_PASS:    Bullet@12345
      TS_HOSTNAME: bullet

    steps:
      - name: Echo inputs
        run: |
          Write-Host "multi_rdp=${{ inputs.multi_rdp }}  count=${{ inputs.rdp_count }}  spawned=${{ inputs.spawned }}"
          Write-Host "test_mode=${{ inputs.test_mode }} purge=${{ inputs.purge_bullet }} rustdesk=${{ inputs.install_rustdesk }}"

      - name: Compute runtime & normalize count
        id: cfg
        shell: pwsh
        run: |
          function Yes($v){ "$v" -match '^(?i:true|1|yes|on)$' }
          $test = Yes("${{ inputs.test_mode }}")
          $runtime = if($test){ 5 } else { 355 }
          $purge = Yes("${{ inputs.purge_bullet }}")
          $rd = Yes("${{ inputs.install_rustdesk }}")
          $multi = Yes("${{ inputs.multi_rdp }}")
          $spawned = Yes("${{ inputs.spawned }}")
          $count = [int]("${{ inputs.rdp_count }}")
          if($count -lt 1){ $count = 1 }
          if($count -gt 10){ $count = 10 }

          "runtime=$runtime" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "purge=$purge"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "rustdesk=$rd"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "multi=$multi"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "spawned=$spawned" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "count=$count"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Runtime=$runtime min | Purge=$purge | RustDesk=$rd | Multi=$multi (count=$count) | Spawned=$spawned"

      - name: Purge bullet* devices (start)
        if: ${{ steps.cfg.outputs.purge == 'True' }}
        shell: pwsh
        env:
          TAILNET:  ${{ inputs.ts_tailnet }}
          APIKEY:   ${{ inputs.ts_api_key }}
        run: |
          $pair = "$env:TAILNET:$env:APIKEY"
          $b64  = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair))
          $hdrs = @{ Authorization = "Basic $b64"; Accept = "application/json" }
          try{
            $list = Invoke-RestMethod -Uri "https://api.tailscale.com/api/v2/tailnet/$($env:TAILNET)/devices" -Headers $hdrs -Method GET
            $targets = @($list.devices | Where-Object { $_.hostname -match '^bullet(\d+)?$' -or $_.hostname -like 'bullet*' })
            if($targets.Count){ foreach($d in $targets){ Write-Host "Deleting $($d.hostname)"; Invoke-RestMethod -Uri "https://api.tailscale.com/api/v2/device/$($d.id)" -Headers $hdrs -Method DELETE | Out-Null; Start-Sleep -Milliseconds 200 } }
            else { Write-Host "No bullet* devices to delete." }
          } catch { Write-Host "Purge warning: $($_.Exception.Message)" }

      - name: Setup Tailscale + RDP
        shell: pwsh
        env:
          AUTHKEY: ${{ inputs.ts_authkey }}
        run: |
          $ErrorActionPreference="Stop"
          # User + RDP
          $u=$env:RDP_USER; $p=$env:RDP_PASS
          $sec = ConvertTo-SecureString $p -AsPlainText -Force
          if (-not (Get-LocalUser -Name $u -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Add-LocalGroupMember -Group Administrators -Member $u
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u
          } else {
            Set-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Enable-LocalUser -Name $u
          }
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null

          # Tailscale
          $exe="C:\Program Files\Tailscale\tailscale.exe"
          if(-not (Test-Path $exe)){
            $url='https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe'
            $dst="$env:TEMP\tailscale-setup.exe"
            Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
            Start-Process $dst -ArgumentList "/quiet" -Wait
          }
          Start-Service Tailscale -ErrorAction SilentlyContinue
          & $exe logout | Out-Null
          & $exe up --authkey "${{ inputs.ts_authkey }}" --hostname "$env:TS_HOSTNAME" --accept-routes --accept-dns=false
          $ip4 = (& $exe ip -4 | Select-Object -First 1)
          $dns = (& $exe status --json | ConvertFrom-Json).Self.DNSName
          Write-Host "RDP → user=$env:RDP_USER pass=$env:RDP_PASS ip=$ip4 dns=$dns"

      - name: Install & Launch RustDesk (resilient/fast)
        if: ${{ steps.cfg.outputs.rustdesk == 'True' }}
        shell: pwsh
        run: |
          $ErrorActionPreference="Continue"
          $ProgressPreference="SilentlyContinue"
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.exe"
          $dst = "$env:TEMP\rustdesk.exe"

          try{
            if(-not (Test-Path $dst)){ Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing -TimeoutSec 120 }
          } catch { Write-Host "RustDesk download warning: $($_.Exception.Message)" }

          if(Test-Path $dst){
            try{
              $p = Start-Process $dst -ArgumentList "/VERYSILENT","/NORESTART" -PassThru
              if(-not $p.WaitForExit(90000)){ Write-Host "Installer still running; proceeding…" }
            } catch { Write-Host "Installer warning: $($_.Exception.Message)" }
          }

          $rd = Get-ChildItem "C:\Program Files*" -Recurse -Filter "rustdesk.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if($rd){
            Write-Host "Launching RustDesk: $($rd.FullName)"
            Start-Process $rd.FullName -WindowStyle Normal
            Start-Sleep -Seconds 2
          } else {
            Write-Host "RustDesk not found after install (continuing)."
          }

      - name: Chrome Remote Desktop (single-RDP only)
        if: ${{ steps.cfg.outputs.multi != 'True' && inputs.crd_code != '' }}
        shell: pwsh
        env:
          CODE: ${{ inputs.crd_code }}
        run: |
          $crdExe = Join-Path ${env:PROGRAMFILES(X86)} "Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          if(-not (Test-Path $crdExe)){ Write-Host "CRD not installed on image; skipping."; exit 0 }
          $code=$env:CODE.Trim(); if([string]::IsNullOrWhiteSpace($code)){ Write-Host "Empty CODE; skip."; exit 0 }
          $redir="https://remotedesktop.google.com/_/oauthredirect"
          Start-Process $crdExe -ArgumentList @("--code=$code","--redirect-url=$redir","--name=$env:COMPUTERNAME") -WindowStyle Hidden
          Write-Host "CRD host started with provided CODE."

      - name: NOTE — CRD disabled in multi-RDP mode
        if: ${{ steps.cfg.outputs.multi == 'True' && inputs.crd_code != '' }}
        run: echo "Multi-RDP is ON, so CRD CODE is intentionally ignored for this run."

      - name: Keep alive (~${{ steps.cfg.outputs.runtime }} min)
        shell: pwsh
        run: |
          $mins = [int]"${{ steps.cfg.outputs.runtime }}"
          $end=(Get-Date).AddMinutes($mins); $i=0
          while((Get-Date) -lt $end){
            if(($i % 30) -eq 0){ Write-Host "Alive… $([int]([math]::Ceiling(($end-(Get-Date)).TotalMinutes))) min left" }
            Start-Sleep -Seconds 60; $i++
          }

      - name: Purge bullet* devices (end)
        if: ${{ steps.cfg.outputs.purge == 'True' }}
        shell: pwsh
        env:
          TAILNET:  ${{ inputs.ts_tailnet }}
          APIKEY:   ${{ inputs.ts_api_key }}
        run: |
          $pair = "$env:TAILNET:$env:APIKEY"
          $b64  = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair))
          $hdrs = @{ Authorization = "Basic $b64"; Accept = "application/json" }
          try{
            $list = Invoke-RestMethod -Uri "https://api.tailscale.com/api/v2/tailnet/$($env:TAILNET)/devices" -Headers $hdrs -Method GET
            $targets = @($list.devices | Where-Object { $_.hostname -match '^bullet(\d+)?$' -or $_.hostname -like 'bullet*' })
            foreach($d in $targets){ Write-Host "Deleting $($d.hostname)"; Invoke-RestMethod -Uri "https://api.tailscale.com/api/v2/device/$($d.id)" -Headers $hdrs -Method DELETE | Out-Null; Start-Sleep -Milliseconds 200 }
          } catch { Write-Host "Purge warning (end): $($_.Exception.Message)" }

      - name: Dispatch N-1 child runs (only once from parent)
        if: ${{ steps.cfg.outputs.multi == 'True' && steps.cfg.outputs.spawned == 'False' && steps.cfg.outputs.count != '1' }}
        shell: pwsh
        env:
          OWNER: ${{ github.repository_owner }}
          REPO:  ${{ github.event.repository.name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF:   ${{ github.ref }}
          COUNT: ${{ steps.cfg.outputs.count }}
        run: |
          $headers = @{ Authorization = "Bearer $env:TOKEN"; Accept = "application/vnd.github+json" }
          $repo = "$env:OWNER/$env:REPO"
          $url = "https://api.github.com/repos/$repo/actions/workflows/rdp-tailscale-A.yml/dispatches"
          $n = [int]$env:COUNT
          for($i=2; $i -le $n; $i++){
            $body = @{
              ref = "$env:REF"
              inputs = @{
                ts_tailnet      = "${{ inputs.ts_tailnet }}"
                ts_api_key      = "${{ inputs.ts_api_key }}"
                ts_authkey      = "${{ inputs.ts_authkey }}"
                test_mode       = "${{ inputs.test_mode }}"
                purge_bullet    = "false"
                install_rustdesk= "${{ inputs.install_rustdesk }}"
                crd_code        = ""
                multi_rdp       = "false"
                rdp_count       = "1"
                spawned         = "true"
              }
            } | ConvertTo-Json -Depth 4
            Write-Host "Dispatching child #$i"
            Invoke-RestMethod -Method POST -Uri $url -Headers $headers -Body $body
            Start-Sleep -Milliseconds 300
          }
          Write-Host "Done dispatching $($n-1) child run(s)."

      - name: Summary
        run: echo "Run complete."
